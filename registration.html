<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Get Started | TEXLearn Learning Modules</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/register.css">

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header class="registration-header">

    <div class="header-inner">

        <a
            href="index.html"
            class="logo">

            <img
                src="assets/logo.webp"
                alt="TEXLearn Learning Modules">

        </a>

    </div>

</header>



<!-- ==================================================
     MAIN
================================================== -->

<main class="registration-main">

    <div class="registration-container">


        <!-- ==========================================
             HEADING
        =========================================== -->

        <div class="registration-heading">

            <h1>
                Get Started with TEXLearn
            </h1>

            <p>
                Enter your details to continue to secure checkout.
            </p>

        </div>



        <!-- ==========================================
             REGISTRATION CARD
        =========================================== -->

        <div class="registration-card">


            <form
                id="registrationForm"
                novalidate>


                <!-- ==================================
                     NAME
                =================================== -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                        <span>*</span>
                    </label>

                    <div class="input-box">

                        <i data-lucide="user"></i>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name">

                    </div>

                    <small class="validation-message"></small>

                </div>



                <!-- ==================================
                     CONTACT
                =================================== -->

                <div class="form-group">

                    <label for="contact">
                        Contact
                        <span>*</span>
                    </label>

                    <div class="input-box">

                        <i data-lucide="phone"></i>

                        <input
                            type="tel"
                            id="contact"
                            name="contact"
                            placeholder="Enter your mobile number"
                            autocomplete="tel"
                            inputmode="numeric">

                    </div>

                    <small class="validation-message"></small>

                </div>



                <!-- ==================================
                     EMAIL
                =================================== -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                        <span>*</span>
                    </label>

                    <div class="input-box">

                        <i data-lucide="mail"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            inputmode="email">

                    </div>

                    <small class="validation-message"></small>

                </div>



                <!-- ==================================
                     INSTITUTION TYPE
                =================================== -->

                <div class="form-group">

                    <label for="institutionType">
                        Institution Type
                        <span>*</span>
                    </label>

                    <div class="input-box">

                        <i data-lucide="graduation-cap"></i>

                        <select
                            id="institutionType"
                            name="institutionType"
                            required>

                            <option value="">
                                Select institution type
                            </option>

                            <option value="SCHOOL">
                                School
                            </option>

                            <option value="COLLEGE">
                                College
                            </option>

                            <option value="OTHERS">
                                Others
                            </option>

                        </select>

                    </div>

                    <small class="validation-message"></small>

                </div>



                <!-- ==================================
                     INSTITUTION
                =================================== -->

                <div
                    class="form-group"
                    id="institutionGroup">

                    <label for="institution">
                        Institution
                        <span>*</span>
                    </label>

                    <div class="input-box">

                        <i data-lucide="school"></i>

                        <select
                            id="institution"
                            name="institution"
                            required>

                            <option value="">
                                Select institution type first
                            </option>

                        </select>

                    </div>

                    <small class="validation-message"></small>

                </div>



                <!-- ==================================
                     CONTINUE
                =================================== -->

                <button
                    id="continueButton"
                    type="submit">

                    <span>
                        Continue to Payment
                    </span>

                    <i data-lucide="arrow-right"></i>

                </button>



                <!-- ==================================
                     SECURITY NOTE
                =================================== -->

                <div class="checkout-note">

                    <i data-lucide="lock-keyhole"></i>

                    <span>
                        Secure checkout powered by Razorpay
                    </span>

                </div>


            </form>

        </div>



        <!-- ==========================================
             SMALL FOOTNOTE
        =========================================== -->

        <p class="registration-footnote">

            One-time purchase • No subscription

        </p>


    </div>

</main>



<!-- ==================================================
     SCRIPTS
================================================== -->

<script src="js/config.js"></script>

<script src="js/register.js"></script>


</body>

</html>

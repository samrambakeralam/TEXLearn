<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reading — SAMRAMBA KERALAM 2030</title>

    <link
        rel="stylesheet"
        href="css/reader.css"
    >
</head>

<body>

    <main class="reader-app">

       <header class="reader-header">

    <a
        href="library.html"
        id="readerBackButton"
        class="reader-back"
    >
        ← Library
    </a>


    <div
        class="reader-header-actions"
    >

        <button
            type="button"
            id="readerNotesButton"
            class="reader-notes-button"
        >
            📝 Notes & Highlights
        </button>


        <div
            class="reader-page-indicator"
            id="readerPageIndicator"
        >
            1 / 3
        </div>

    </div>

</header>


        <section
            class="reader-content"
            id="readerContent"
        >
            <div class="reader-loading">
                Loading book…
            </div>
        </section>


        <footer class="reader-controls">

    <div
        class="reader-page-dots"
        id="readerPageDots"
        aria-label="Book pages"
    ></div>

</footer>

    </main>


    <script src="js/reader.js"></script>

</body>
</html>
